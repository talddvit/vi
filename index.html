  <style>
    :root{
      --bg:#070a09;
      --ink:#f5f2e9;
      --muted:#a7ada8;
      --gold:#d8b866;
      --gold2:#f1dc99;
      --green:#173c30;
      --line:rgba(255,255,255,.10);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
    body{
      font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      overflow-x:hidden;
    }
    body:before{
      content:"";position:fixed;inset:0;pointer-events:none;opacity:.24;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.11'/%3E%3C/svg%3E");
    }
    .hero{
      position:relative;isolation:isolate;min-height:100svh;display:grid;place-items:center;
      padding:40px 24px;
      background:
        radial-gradient(circle at 50% 52%,rgba(29,82,63,.62),transparent 31%),
        radial-gradient(circle at 50% 105%,rgba(216,184,102,.11),transparent 32%),
        linear-gradient(180deg,#090d0b 0%,#07100c 58%,#050706 100%);
    }
    .hero:after{
      content:"";position:absolute;z-index:-1;width:min(72vw,850px);aspect-ratio:1;
      border:1px solid rgba(216,184,102,.10);border-radius:50%;
      box-shadow:0 0 100px rgba(14,80,57,.2),inset 0 0 90px rgba(14,80,57,.12);
    }
    .top{
      position:absolute;top:28px;left:50%;transform:translateX(-50%);
      display:flex;align-items:center;gap:10px;letter-spacing:.24em;
      text-transform:uppercase;font-size:11px;color:#d9d7ce;white-space:nowrap;
    }
    .mark{
      width:28px;height:28px;border:1px solid rgba(216,184,102,.55);border-radius:50%;
      display:grid;place-items:center;color:var(--gold);font-family:Georgia,serif;font-size:15px;
    }
    .content{width:min(900px,100%);text-align:center}
    .eyebrow{
      margin:0 0 24px;color:var(--gold2);font-size:11px;font-weight:700;
      letter-spacing:.32em;text-transform:uppercase;
    }
    h1{
      margin:0 auto;max-width:880px;font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(48px,8.2vw,112px);font-weight:400;line-height:.88;
      letter-spacing:-.055em;text-wrap:balance;
    }
    .rule{width:56px;height:1px;margin:32px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
    .sub{
      margin:0 auto 34px;max-width:520px;color:#c3c7c2;
      font-size:clamp(16px,2vw,20px);line-height:1.6;
    }
    .cta{
      position:relative;display:inline-flex;align-items:center;justify-content:center;gap:13px;
      min-width:230px;padding:18px 28px;border:1px solid #ead28d;border-radius:2px;
      background:linear-gradient(135deg,#f1d98f,#cba851);color:#11150f;
      text-decoration:none;font-size:13px;font-weight:800;letter-spacing:.16em;
      text-transform:uppercase;box-shadow:0 16px 55px rgba(216,184,102,.14);
      transition:.25s ease;
    }
    .cta:hover{transform:translateY(-2px);filter:brightness(1.06);box-shadow:0 20px 70px rgba(216,184,102,.23)}
    .cta span{font-size:18px;line-height:0;transition:transform .25s ease}
    .cta:hover span{transform:translateX(3px)}
    .trust{
      margin-top:20px;color:#777f79;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    }
    .cards{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
    .card{
      position:absolute;width:92px;height:128px;border:1px solid rgba(255,255,255,.08);
      border-radius:8px;background:linear-gradient(145deg,rgba(255,255,255,.035),rgba(255,255,255,.005));
      color:rgba(216,184,102,.20);font:26px Georgia,serif;display:flex;padding:13px;
      backdrop-filter:blur(2px);
    }
    .c1{left:8%;top:20%;transform:rotate(-18deg)}
    .c2{right:8%;top:23%;transform:rotate(16deg)}
    .c3{left:15%;bottom:9%;transform:rotate(11deg)}
    .c4{right:14%;bottom:8%;transform:rotate(-13deg)}
    footer{
      position:absolute;bottom:18px;left:0;right:0;text-align:center;
      color:#5f6661;font-size:9px;letter-spacing:.12em;text-transform:uppercase;
    }
    @media(max-width:700px){
      .hero{padding:80px 20px 62px}
      .top{top:22px}
      h1{font-size:clamp(48px,16vw,74px);line-height:.92}
      .sub{font-size:16px;max-width:330px}
      .cta{width:min(100%,330px);padding:19px 24px}
      .card{width:64px;height:90px;font-size:19px;opacity:.65}
      .c1{left:-16px;top:20%}.c2{right:-16px;top:24%}
      .c3{left:3%;bottom:8%}.c4{right:2%;bottom:10%}
    }
  </style>
</head>
<body>
  <main class="hero">
    <div class="top"><span class="mark">♠</span><span>Phòng Poker Việt Nam</span></div>

    <div class="cards" aria-hidden="true">
      <div class="card c1">A♠</div>
      <div class="card c2">K♦</div>
      <div class="card c3">Q♣</div>
      <div class="card c4">J♥</div>
    </div>

    <section class="content">
      <p class="eyebrow">Trải nghiệm poker đẳng cấp</p>
      <h1>Mọi thứ bắt đầu từ một ván bài</h1>
      <div class="rule"></div>
      <p class="sub">Chọn bàn và bắt đầu cuộc chơi.</p>
      <a class="cta"
         href="https://t.me/m/0xU5R3EcOTY1"
         target="_blank"
         rel="noopener noreferrer"
         onclick="if(window.fbq){fbq('track','Lead');}">
        Chơi ngay <span>→</span>
      </a>
      <div class="trust">Bàn chơi đang chờ bạn</div>
    </section>

    <footer>Chơi có trách nhiệm · 18+</footer>
  </main>

  <noscript>
    <img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=2997070650629041&ev=PageView&noscript=1"
      alt="" />
  </noscript>

</html>
